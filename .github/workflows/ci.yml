name: CI Pipeline

on:
  push:
    branches: [ main, develop ]

  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: library_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d library_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: PostgreSQL schema oluştur
        env:
          PGPASSWORD: test_password
        run: |
          psql -h localhost -U test_user -d library_test -c "CREATE SCHEMA IF NOT EXISTS library;"

      - name: Build ve test et
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/library_test
          SPRING_DATASOURCE_USERNAME: test_user
          SPRING_DATASOURCE_PASSWORD: test_password
          JWT_SECRET: test-secret-key-for-ci-only-min-256-bit-test-secret-key-for-ci-only
          JWT_EXPIRATION: 86400000
        run: mvn clean verify

      - name: Test sonuçlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/target/surefire-reports/
          retention-days: 7